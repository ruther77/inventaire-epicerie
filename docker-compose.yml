
services:
  db:
    image: postgres:16
    container_name: inventaire-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: inventaire-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaire-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventaire-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaire-net

  backup:
    image: postgres:16
    container_name: inventaire-backup
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_backups:/backups
    entrypoint: [ "bash", "-lc", "while true; do pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -F c -f /backups/epicerie_$(date +%F_%H%M).dump && sleep 86400; done" ]
    networks:
      - inventaire-net

volumes:
  db_data:
  db_backups:

networks:
  inventaire-net:
    driver: bridge

services:
  db:
    image: postgres:16
    container_name: inventaire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-inventaire-app:latest}
    container_name: inventaire-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STREAMLIT_SERVER_ENABLE_CORS: "false"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    networks:
      - inventaire-net
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2
    container_name: inventaire-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy will request certificates for your domain automatically (Let's Encrypt)
      # Set SITE_DOMAIN in your .env.prod, e.g. inv.mondomaine.fr
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - inventaire-net
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  inventaire-net:
    driver: bridge
